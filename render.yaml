# ============================================================
# Render.com Deployment Configuration
# Portfolio Mantra — Full-Stack (Node + Python + Java + React)
# ============================================================

databases:
  - name: portfolio-postgres
    databaseName: portfolio_db
    user: mantra
    plan: free

services:
  # ── Node.js / Express API ──────────────────────────────────
  - type: web
    name: mantra-node-api
    runtime: node
    rootDir: backend-node
    buildCommand: npm install
    startCommand: node src/server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://mantra-portfolio.onrender.com

  # ── Python / FastAPI Microservice ─────────────────────────
  - type: web
    name: mantra-python-api
    runtime: python
    rootDir: backend-python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://mantra-portfolio.onrender.com"]'

  # ── Java / Spring Boot Service ────────────────────────────
  - type: web
    name: mantra-java-api
    runtime: docker
    rootDir: backend-java
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: portfolio-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: portfolio-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: portfolio-postgres
          property: password

  # ── React Frontend (Static Site) ──────────────────────────
  - type: web
    name: mantra-portfolio
    runtime: static
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: build
    plan: free
    routes:
      - type: rewrite
        source: /api/*
        destination: https://mantra-node-api.onrender.com/$1
      - type: rewrite
        source: /py/*
        destination: https://mantra-python-api.onrender.com/$1
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff