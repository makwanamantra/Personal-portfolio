version: '3.9'

services:
  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: mantra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio_db
      POSTGRES_USER: mantra
      POSTGRES_PASSWORD: mantra_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mantra -d portfolio_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mantra-net

  # ─── Node.js / Express API ─────────────────────────────────────────────────
  backend-node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: mantra-node
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://mantra:mantra_secret@postgres:5432/portfolio_db
      JWT_SECRET: change_me_in_production
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mantra-net

  # ─── Python / FastAPI Microservice ─────────────────────────────────────────
  backend-python:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: mantra-python
    restart: unless-stopped
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://mantra:mantra_secret@postgres:5432/portfolio_db
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:80"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mantra-net

  # ─── Java / Spring Boot Service ────────────────────────────────────────────
  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: mantra-java
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portfolio_db
      SPRING_DATASOURCE_USERNAME: mantra
      SPRING_DATASOURCE_PASSWORD: mantra_secret
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mantra-net

  # ─── React Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mantra-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend-node
      - backend-python
      - backend-java
    networks:
      - mantra-net

  # ─── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: mantra-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend-node
      - backend-python
      - backend-java
    networks:
      - mantra-net

volumes:
  postgres_data:

networks:
  mantra-net:
    driver: bridge