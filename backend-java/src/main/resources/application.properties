server.port=${PORT:8080}
spring.application.name=mantra-portfolio-java

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mantra_portfolio}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.com.mantra=INFO
logging.pattern.console=%d{HH:mm:ss} \033[32m[JAVA]\033[0m %msg%n